# 0B confirmatory run: official-vs-community Arm 2 (Qwen2.5-7B-Instruct
# only, Q4_K_M + Q3_K_M only -- PREREG §5, symmetry with Arm 1).
#
# Qwen's official GGUFs (Qwen/Qwen2.5-7B-Instruct-GGUF) vs bartowski's
# (0b-qwen-7b-ladder.yaml, same two quant labels) -- comparability arm, not
# a third ladder. Same F16 baseline (f16_path) and same four scored suites
# as the ladder run.
#
# File pins: reference-manifests/qwen2.5-7b-official.json (repo
# Qwen/Qwen2.5-7B-Instruct-GGUF, revision
# bb5d59e06d9551d752d08b292a50eb208b07ab1f). The manifest's own note:
# "Official Qwen GGUFs are sharded for several quant levels
# (multi-part *-NNNNN-of-MMMMM.gguf files)" -- q4_k_m ships as 2 shards.
# llama.cpp/llama-cpp-python loads a sharded GGUF by its FIRST shard's path
# (it discovers and loads the remaining shards itself from the same
# directory, keyed by the GGUF split metadata baked into shard 1); `models.
# ensure_quants`/`resolve_all` therefore use `filename` = the first shard
# and record the second shard as `extra_files` (config.py's QuantFile.
# extra_files -- downloaded + sha256-verified the same way as the primary
# file, but never itself passed to the model loader). q3_k_m is a single
# unsharded file.
#
# imatrix status for the official files: NOT stated anywhere in
# qwen2.5-7b-official.json (no per-file imatrix flag, unlike shootout-8b.
# json's per-file uploader/imatrix fields), and no other committed
# document records how Qwen's own team quantized these. Set to `false`
# here as the conservative default (asserting `true` without evidence would
# be an unverified provenance claim); logged as an open question rather
# than silently assumed -- see OPEN_QUESTIONS.md §6. Re-verify (e.g. via
# the downloaded GGUF's own `quantize.imatrix.file` metadata key, if
# present) before this arm actually runs.

