# PREREG §6 / RUN_0B.md §3: greedy, temp 0.0, top_k 1, seed 42, global
# 1024-token budget -- identical to configs/0b/*.yaml. n_ctx 16384: the 2b
# t=8192 prompts (~8300 tokens) + answers, as in the 0B ladder configs.
generation:
  seed: 42
  temperature: 0.0
  top_k: 1
  max_tokens: 1024
  n_ctx: 16384

suites:
  # PREREG §3.1 Configuration 2a (Q5 comparability run, Qwen2.5-1.5B-Instruct
  # only): the paper's multivalue2 @ 4096 on the sgoel9/paul_graham_essays
  # corpus, n=96, seed=2024. The corpus is an HF dataset (local cache only,
  # never shipped as a file), loaded by
  # suites.longctx_retrieval.load_corpus_dataset_text and verified against
  # corpus_sha256 (registered.CORPUS_2A_SHA256) before any item is built.
  # Suite key `longctx_retrieval_2a` (controller ruling); same builder and
  # grader as 2b. Item-set hash gate: registered.ITEM_SET_SHA256[
  # ("longctx_retrieval_2a", "qwen2.5-1.5b-instruct")].
  longctx_retrieval_2a:
    variant: multivalue2
    target_tokens: 4096
    seed: 2024
    n_items: 96
    corpus_dataset: sgoel9/paul_graham_essays
    corpus_sha256: b6135331a3132d08cb84262870ae8f9d9acb6bae4cd7f0278926a64c38f9329e
    tokenizer_path: models/hf/Qwen2.5-1.5B-Instruct
    max_tokens: 32
  # PREREG §3.1 Configuration 2b + Amendment 1 §A (n=96, seed=2024) / §C: the
  # 1.5B's calibrated in-band setting is multivalue4 @ t=8192 (F16 0.750).
  longctx_retrieval:
    variant: multivalue4
    target_tokens: 8192
    seed: 2024
    n_items: 96
    corpus_path: corpora/pg1184-monte-cristo.txt
    corpus_sha256: 0a21a13834b5215876bd4019af8fbc436abbfbb61b2826db62223eb990071443
    tokenizer_path: models/hf/Qwen2.5-1.5B-Instruct
    max_tokens: 32
  # PREREG §3.2: n=500, seed=3141 (registered, never amended).
  arithmetic:
    n_items: 500
    seed: 3141
  # PREREG §3.3: seed=1301 (fixed n = all 47 template pairs / 94 items).
  # Runs on the 1.5B per OPEN_QUESTIONS §13 (no model restriction in §3.3).
  arithmetic_twins:
    seed: 1301
  # PREREG §3.4 + §7: n=500, confirmatory seed=2718, M3 popularity mix
  # (Amendment 1 §C), 64-token answer budget, seed-2718 alias augmentation
  # (Amendment 1 §B).
  factual_qa:
    n_items: 500
    seed: 2718
    # Convention-correct M3 for items_from_records (deciles ASCENDING by
    # s_pop: index 0 = least popular) -- PREREG §7's prose order reversed
    # (OPEN_QUESTIONS §8; registered.M3_WEIGHTS_CONVENTION).
    weights: [0.04, 0.04, 0.04, 0.04, 0.04, 0.16, 0.16, 0.16, 0.16, 0.16]
    alias_augmentation_path: data/popqa_wikidata_aliases_seed2718.json
    max_tokens: 64

# The registered Q2 teacher-forced NLL passes (PREREG §3.1 answer-token spec;
# OPEN_QUESTIONS §13: both the 2a and 2b items, all 8 loads).
# load_config parses and validates this block (every named suite must exist
# above) into LadderConfig.nll; run_pipeline never reads it. It is consumed
# by scripts/nll_driver.py (commit ba146e7; OPEN_QUESTIONS §16: the 0B
# driver was never committed, so this one was written, not recovered) as
# its default --suites. The driver rebuilds the items and their answer-span
# specs with the same builder the generate stage uses
# (__main__.build_items), rather than reading answer_spans.jsonl.
# Invocation and order: RUN_0B_PRIME.md §3.
nll:
  suites: [longctx_retrieval_2a, longctx_retrieval]
