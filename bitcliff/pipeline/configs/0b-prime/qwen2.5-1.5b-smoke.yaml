# Smoke config: Qwen2.5-1.5B-Instruct, F16 + Q4_K_M, 5 items per suite.
#
# EXPLORATORY and NON-REGISTERED -- not a confirmatory run, no number from
# it is publishable. Purpose: a cheap local end-to-end check of the 0B-prime
# pipeline shape (2a HF-dataset corpus + 2b file corpus + arithmetic +
# factual_qa, tokenizer gate, answer-span sidecar, per-suite budgets) before
# the registered run (configs/0b-prime/qwen2.5-1.5b-ladder.yaml).
#
# Every suite block matches the ladder config except `n_items: 5` (the
# registered n is 96 / 500). A non-registered n makes the boot-time
# item-set hash gate refuse outright, so `exploratory: true` below is
# required: it skips that gate (loud printed warning) for every suite.
#
# arithmetic_twins is OMITTED: its n is fixed at all 94 pair items (PREREG
# §3.3) with no n knob, and adding one only for a smoke run would be a new
# registered-suite code path. The ladder config carries it.

