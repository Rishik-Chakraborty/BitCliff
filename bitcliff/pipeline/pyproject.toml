[project]
name = "bitcliff-pipeline"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Rishik Chakraborty", email = "rishikchak2008@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "datasets>=5.0.1",
    "huggingface-hub>=1.28.0",
    "llama-cpp-python>=0.3.35",
    "matplotlib>=3.11.1",
    "pyyaml>=6.0.3",
]

[project.scripts]
bitcliff-pipeline = "bitcliff_pipeline:main"

[build-system]
requires = ["uv_build>=0.11.31,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
